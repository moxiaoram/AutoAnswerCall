name: Build AutoAnswerAudio (RootHide)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install RootHide Theos
        run: |
          git clone --depth 1 --recursive https://github.com/roothide/theos.git "$RUNNER_TEMP/theos"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"

      - name: Install build tools
        run: brew install ldid dpkg

      - name: Build RootHide arm64e package
        run: |
          set -euxo pipefail
          make clean package FINALPACKAGE=1 ARCHS=arm64e THEOS="$THEOS" THEOS_PACKAGE_SCHEME=roothide 2>&1 | tee build.log

      - name: Validate package contents
        run: |
          set -euxo pipefail
          debs=(packages/*.deb)
          test "${#debs[@]}" -gt 0
          for deb in "${debs[@]}"; do
            dpkg-deb --info "$deb"
            test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64e"
            dpkg-deb --contents "$deb" | grep -F 'AutoAnswerCall.dylib'
            dpkg-deb --contents "$deb" | grep -F 'AutoAnswerTRBridge.dylib'
            dpkg-deb --contents "$deb" | grep -F 'AutoAnswerTRBridge.plist'
            dpkg-deb --contents "$deb" | grep -F 'AutoAnswerCallPrefs.bundle'
            dpkg-deb --contents "$deb" | grep -F 'autoanswer.call.plist'
            # RootHide 必须带 patch 链接，否则注入不生效
            dpkg-deb --contents "$deb" | grep -E 'roothidepatch' || {
              echo "ERROR: 缺少 roothidepatch 符号链接，RootHide 下不会生效"; exit 1; }
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoAnswerAudio-build-log
          path: build.log

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: AutoAnswerAudio-roothide-arm64e
          path: packages/*.deb
          if-no-files-found: error
