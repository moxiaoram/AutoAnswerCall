name: Build AwemeVision RELAXIN RootHide DEB

on:
  push:
    branches-ignore: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relaxin-roothide:
    name: iOS 17.3 / Relaxin 0.4.8 / RootHide
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Static source/config audit
        run: python3 scripts/check_relaxin_source.py

      # RootHide 工具链来源，静态审计脚本会校验这一行
      # theos-src: https://github.com/roothide/theos
      - name: Prepare RootHide Theos and iOS SDK
        run: |
          set -euxo pipefail
          git clone --depth 1 --recursive https://github.com/roothide/theos.git "$RUNNER_TEMP/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          SDK=$(ls -d "$RUNNER_TEMP"/sdks/iPhoneOS*.sdk | sort -V | tail -1)
          mkdir -p "$RUNNER_TEMP/theos/sdks"
          ln -sfn "$SDK" "$RUNNER_TEMP/theos/sdks/$(basename "$SDK")"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "SDK selected: $(basename "$SDK")"

      - name: Install build tools
        run: brew install ldid dpkg make

      - name: Export GNU Make path
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Clean and build only RootHide DEB
        env:
          INSTALL: '0'
        run: |
          set -euo pipefail
          echo "THEOS=$THEOS"
          gmake clean SCHEME=roothide
          gmake package SCHEME=roothide FINALPACKAGE=1 -j"$(sysctl -n hw.ncpu)"
          test "$(find packages -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ')" = "1"

      - name: Verify Debian contents, architecture, dylib and filter
        run: |
          set -euo pipefail
          python3 scripts/verify_relaxin_deb.py packages/*.deb
          shasum -a 256 packages/*.deb | tee packages/SHA256SUMS.txt

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: AwemeVision-2.0.0-Relaxin0.4.8-iOS17.3-RootHide
          path: |
            packages/*.deb
            packages/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
