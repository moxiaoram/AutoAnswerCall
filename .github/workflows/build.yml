name: Build AutoAnswerCall

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install RootHide Theos
        run: |
          git clone --depth 1 --recursive https://github.com/roothide/theos.git "$RUNNER_TEMP/theos"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"

      - name: Install build tools
        run: brew install ldid dpkg ripgrep

      - name: Policy, library and record regression
        run: |
          set -euxo pipefail
          {
            cc -std=c11 tests/policy.c -lm -o /tmp/aac-policy
            /tmp/aac-policy
            cc -std=c11 tests/playback_policy.c -lm -o /tmp/aac-playback-policy
            /tmp/aac-playback-policy
            python3 tests/playback_policy_checks.py
            # 1.16.0 (kept): pure-arithmetic unit test of the chunk framing (AACChunkMath.h): chunk
            # count/lengths, seq/total validity, base64url alphabet, completeness mask, state
            # packing, slot count and the CRC-32 known vector. Really compiled and really run.
            cc -std=c11 tests/chunkmath.c -o /tmp/aac-chunkmath
            /tmp/aac-chunkmath
            # 1.17.8: static checks for the live-button discovery + simulated tap path (bounded
            # live hierarchy traversal, signal priority, option/red-blacklist applied to
            # identifiers and titles, the three tap mechanisms in order, the per-UUID single tap
            # and the non-double-tap settle window, and the candidate/mechanism/connected report).
            python3 tests/source_checks.py
            python3 tests/repair_checks.py
            python3 tests/bridge_checks.py
            python3 tests/system_playback_checks.py
            python3 tests/manual_handoff_checks.py
            python3 tests/native_add_overlay_checks.py
            xcrun clang -fobjc-arc -framework Foundation -framework AVFoundation tests/library.m -o /tmp/aac-library
            /tmp/aac-library
            xcrun clang -fobjc-arc -framework Foundation tests/records.m -o /tmp/aac-records
            /tmp/aac-records
          } 2>&1 | tee tests.log

      - name: Build RootHide arm64e package
        run: |
          set -euxo pipefail
          { git -C "$THEOS" rev-parse HEAD; xcrun --sdk iphoneos --show-sdk-version; xcrun clang --version; command -v ldid; } | tee environment.log
          make clean package FINALPACKAGE=1 \
            ARCHS=arm64e \
            THEOS="$THEOS" \
            THEOS_PACKAGE_SCHEME=roothide 2>&1 | tee build.log

      - name: Validate package
        run: |
          set -euxo pipefail
          debs=(packages/*.deb)
          test "${#debs[@]}" -gt 0
          for deb in "${debs[@]}"; do
            dpkg-deb --info "$deb"
            test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64e"
            test "$(dpkg-deb -f "$deb" Version)" = "1.17.8"
            dpkg-deb --contents "$deb" | rg -F 'AutoAnswerCall.dylib'
            dpkg-deb --contents "$deb" | rg -F 'AutoAnswerCallPrefs.bundle'
            dpkg-deb --contents "$deb" | rg -F 'autoanswer.call.plist'
            # Apple Platform Deployment lists Phone as com.apple.mobilephone (case-sensitive).
            rm -rf /tmp/aac-debcheck && mkdir -p /tmp/aac-debcheck
            dpkg-deb -x "$deb" /tmp/aac-debcheck
            python3 tests/deb_check.py /tmp/aac-debcheck
          done

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoAnswerCall-build-logs
          path: |
            build.log
            environment.log
            tests.log

      - name: Upload deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoAnswerCall-roothide-arm64e
          path: packages/*.deb
          if-no-files-found: error
