name: Build RootHide diagnostics
on:
  workflow_dispatch:
  push:
    paths: ['**.m', '**.h', 'tests/**', Makefile, control, ClashAssist.plist, '.github/workflows/build.yml']
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install tools and RootHide Theos
        run: |
          brew install ldid dpkg
          git clone --depth 1 --recursive https://github.com/roothide/theos.git "$RUNNER_TEMP/theos"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
      - name: Test local synthetic state machine
        run: |
          set -euo pipefail
          mkdir -p build
          cc -std=c11 -Wall -Wextra -Werror -I. tests/lab_core.c -o /tmp/clash-lab-test
          /tmp/clash-lab-test 2>&1 | tee build/lab-tests.log
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p build
          { git -C "$THEOS" rev-parse HEAD; xcrun --sdk iphoneos --show-sdk-version; xcrun clang --version; } > build/environment.log
          make clean
          make package FINALPACKAGE=1 ARCHS=arm64e THEOS_PACKAGE_SCHEME=roothide 2>&1 | tee build/build.log
      - name: Validate
        run: |
          set -euo pipefail
          for pkg in packages/*.deb; do
            test "$(dpkg-deb -f "$pkg" Architecture)" = iphoneos-arm64e
            dpkg-deb --info "$pkg"
            dpkg-deb --contents "$pkg"
            shasum -a 256 "$pkg"
          done > build/package-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ClashAssist-RootHide-diagnostics
          path: |
            packages/*.deb
            build/*.log
